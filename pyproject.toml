[project]
name = "repermon"
version = "0.1.0"
description = "AIOps CI/CD Performance Operator"
requires-python = ">=3.12"
dependencies = [
  "mypy==1.16.1",
  "mypy-extensions==1.1.0",
  "pathspec==0.12.1",
  "typing-extensions==4.14.1",
  "kopf==1.38.0",
  "elasticsearch==9.1.0",
  "pytest==9.0.1",
  "requests==2.32.5",
  "dagger-io",
  "pre-commit>=4.2.0",
  "pytest-cov>=7.0.0",
  "pathlib>=1.0.1",
  "gql>=4.0.0",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "-v",
]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.12.3",
]

